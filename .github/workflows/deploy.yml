name: Deploy site

on:
  push:
    branches: [main]
  # The examples are checked against fckt's main branch, which moves on its own.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fckt-lang
      # fckt builds Kastor from ../kastor.
      - uses: actions/checkout@v4
        with:
          repository: m4xy/fckt
          path: fckt
      - uses: actions/checkout@v4
        with:
          repository: m4xy/kastor
          path: kastor
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the compiler
        working-directory: fckt
        run: ./gradlew :installDist
      - name: Check the examples
        working-directory: fckt-lang
        run: opam exec -- node scripts/check-examples.mjs
        env:
          FCKT: ${{ github.workspace }}/fckt/build/install/fckt/bin/fckt

  build:
    needs: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
