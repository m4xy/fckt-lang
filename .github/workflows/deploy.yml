name: Deploy site

on:
  push:
    branches: [main]
  # The examples are checked against fckt's main branch, which moves on its own.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Checks every example, builds what runs fckt in the browser, then builds the site, all against
  # fckt's main branch.
  build:
    runs-on: ubuntu-latest
    steps:
      # The whole history, so each page's last updated date is its own.
      - uses: actions/checkout@v4
        with:
          path: fckt-lang
          fetch-depth: 0
      # fckt builds Kastor from ../kastor.
      - uses: actions/checkout@v4
        with:
          repository: m4xy/fckt
          path: fckt
      - uses: actions/checkout@v4
        with:
          repository: m4xy/kastor
          path: kastor
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5
      - name: Install js_of_ocaml
        run: opam install -y js_of_ocaml js_of_ocaml-ppx js_of_ocaml-toplevel
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fckt-lang/package-lock.json
      - name: Build the compiler
        working-directory: fckt
        run: ./gradlew :installDist
      - name: Check the examples
        working-directory: fckt-lang
        run: opam exec -- node scripts/check-examples.mjs
        env:
          FCKT: ${{ github.workspace }}/fckt/build/install/fckt/bin/fckt
      - name: Build the playground
        working-directory: fckt-lang
        run: opam exec -- playground/build.sh
        env:
          FCKT_REPO: ${{ github.workspace }}/fckt
      - name: Build the site
        working-directory: fckt-lang
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: fckt-lang/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
